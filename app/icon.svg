<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Zygote">
  <!--
    A mouse zygote as it appears under DIC: zona pellucida, cytoplasm, and two apposed
    pronuclei just before breakdown, the moment in the window this model predicts over
    and the one with the most distinctive silhouette.

    Greyscale on purpose. The site's palette reserves colour for data and uses #111 as
    the accent rather than a brand hue, and DIC is monochrome anyway, so the on-brand
    rendering and the honest one are the same rendering.

    Drawn to survive 16px: at favicon size the diagonal gradients collapse to flat tone
    and what remains is a ring with two dots in it, which still reads as a cell.

    NOTE: no double hyphen anywhere in these comments. It is illegal inside an XML
    comment, and while browsers tolerate it, librsvg rejects the whole file, which
    silently breaks scripts/build_favicon.mjs.
  -->
  <defs>
    <!-- DIC's signature pseudo-relief: lit from the upper left, shadowed to the lower
         right. It is what makes this read as a micrograph, not a generic cell icon. -->
    <linearGradient id="cyto" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#ebebe8"/>
      <stop offset="0.55" stop-color="#c9c9c4"/>
      <stop offset="1" stop-color="#a3a39d"/>
    </linearGradient>
    <linearGradient id="pn" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#fbfbfa"/>
      <stop offset="0.6" stop-color="#d8d8d3"/>
      <stop offset="1" stop-color="#8e8e88"/>
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="13.1" fill="url(#cyto)"/>
  <circle cx="16" cy="16" r="13.1" fill="none" stroke="#111111" stroke-width="1.75"/>

  <circle cx="12.5" cy="14.6" r="4.15" fill="url(#pn)" stroke="#111111" stroke-width="1.15"/>
  <circle cx="19.5" cy="17.6" r="4.15" fill="url(#pn)" stroke="#111111" stroke-width="1.15"/>
</svg>
